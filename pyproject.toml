[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smart-service-agent"
version = "0.1.0"
description = "AI service intelligence API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pymongo>=4.11,<5.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mongomock>=4.3,<5.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]
demo = [
  "streamlit>=1.32,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_service_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/smart_service_agent/web" = "smart_service_agent/web"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP007", "UP045"] # Pydantic runtime annotations must remain Python 3.9 compatible.
